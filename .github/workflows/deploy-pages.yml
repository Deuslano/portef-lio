name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loccitane-demo/package-lock.json

      - name: Install demo dependencies
        working-directory: loccitane-demo
        run: npm ci

      - name: Build demo
        working-directory: loccitane-demo
        run: npm run build:web

      - name: Assemble site
        shell: bash
        run: |
          mkdir -p _site/loccitane-demo
          cp index.html style.css _site/
          cp -R assets _site/assets
          cp -R loccitane-demo/dist/. _site/loccitane-demo/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4